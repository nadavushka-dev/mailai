<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>mailai</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0e;
    --bg-2: #0f1113;
    --panel: #141619;
    --panel-2: #1a1d21;
    --hover: #17191d;
    --sel: #1d2026;
    --line: #22262b;
    --line-2: #2e333a;
    --fg: #eceef1;
    --fg-2: #c4c9d0;
    --dim: #8b929c;
    --faint: #626872;
    --amber: #f3b340;
    --amber-soft: rgba(243, 179, 64, .12);
    --amber-ink: #241a05;
    --red: #f2806f;
    --red-soft: rgba(242, 128, 111, .12);
    --green: #6ad49b;
    --green-soft: rgba(106, 212, 155, .12);
    --violet: #b8a4ff;
    --violet-soft: rgba(184, 164, 255, .12);
    --blue: #82b6ff;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  ::selection { background: rgba(243, 179, 64, .32); color: var(--fg); }
  * { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid var(--bg); }
  .i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
  kbd {
    font: 500 11px/1 var(--mono);
    color: var(--dim);
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 2px 5px;
    min-width: 18px;
    text-align: center;
    display: inline-block;
  }

  /* ---------- top bar ---------- */
  .top {
    display: flex; align-items: center; gap: 18px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; font-size: 15px; }
  .brand .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--amber); display: grid; place-items: center; color: var(--amber-ink); }
  .brand .mark .i { width: 12px; height: 12px; stroke-width: 2.4; }
  .tabs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .tabs button {
    display: inline-flex; align-items: center; gap: 7px;
    border: 0; background: transparent; color: var(--dim);
    padding: 5px 11px; border-radius: 7px; font-weight: 550; font-size: 13px;
    transition: background .15s, color .15s;
  }
  .tabs button:hover { color: var(--fg-2); }
  .tabs button.on { background: var(--panel-2); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .count { font: 600 11px/1 var(--sans); font-variant-numeric: tabular-nums; padding: 3px 6px; border-radius: 99px; background: var(--line); color: var(--fg-2); }
  .count:empty { display: none; }
  #tab-inbox.on .count { background: var(--amber); color: var(--amber-ink); }
  .spacer { flex: 1; }
  .ghost {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    padding: 5px 8px 5px 10px; border-radius: 8px; font-size: 13px;
  }
  .ghost:hover { color: var(--fg-2); border-color: var(--line-2); }
  .ghost.on { color: var(--amber); border-color: rgba(243,179,64,.4); }
  .ghost.bell { padding: 5px 9px; }
  .ghost.bell.blocked { opacity: .55; }
  .live { display: inline-flex; align-items: center; gap: 7px; color: var(--dim); font-size: 12px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .live.off i { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  .who { color: var(--faint); font-size: 12px; }

  /* ---------- filters ---------- */
  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--bg-2);
  }
  .filters[hidden] { display: none; }
  .filters label {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 0 0 0 10px; color: var(--dim); font-size: 12px;
  }
  .filters label:focus-within { border-color: var(--line-2); }
  .filters input[type="text"] { border: 0; background: transparent; padding: 6px 10px 6px 0; width: 9.5em; outline: none; color: var(--fg); }
  .filters input::placeholder { color: var(--faint); }
  .filters .check { padding-right: 10px; }
  .filters input[type="checkbox"] { accent-color: var(--amber); margin: 6px 0; }
  .filters .clear { border: 0; background: none; color: var(--dim); font-size: 12px; padding: 4px 6px; }
  .filters .clear:hover { color: var(--fg); }

  /* ---------- layout ---------- */
  .split { flex: 1; display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); min-height: 0; }
  .left { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--bg-2); }
  #list { flex: 1; min-height: 0; overflow: auto; padding: 6px; }
  #read { min-height: 0; overflow: auto; display: flex; flex-direction: column; }

  /* ---------- queue rows ---------- */
  .row {
    display: grid; grid-template-columns: 32px 1fr; gap: 0 12px;
    width: 100%; text-align: left;
    padding: 11px 12px; margin: 0 0 2px;
    border: 0; border-radius: 10px; background: transparent; color: inherit;
    transition: background .12s;
  }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--sel); box-shadow: inset 0 0 0 1px var(--line-2); }
  .row.closed { opacity: .6; }
  .av {
    --h: 210;
    width: 32px; height: 32px; border-radius: 9px;
    display: grid; place-items: center;
    font: 650 12px/1 var(--sans); letter-spacing: .02em;
    color: hsl(var(--h) 80% 82%);
    background: hsl(var(--h) 35% 20%);
    box-shadow: inset 0 0 0 1px hsl(var(--h) 40% 30%);
  }
  .av.human { color: var(--amber-ink); background: var(--amber); box-shadow: none; }
  .av.lg { width: 40px; height: 40px; border-radius: 11px; font-size: 14px; }
  .r-body { min-width: 0; display: grid; gap: 3px; }
  .r-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .agent { font-weight: 620; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .host { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .age { margin-left: auto; padding-left: 8px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .age.warm { color: var(--amber); }
  .age.hot { color: var(--red); }
  .r-q { color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .r-q code { font: 12.5px/1.45 var(--mono); color: var(--fg); }
  .r-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
  .r-q .subj { color: var(--fg); font-weight: 580; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; flex: none; align-self: center; margin-right: 2px; }
  .gone { color: var(--faint); font-size: 12px; font-weight: 450; }
  .unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); display: inline-block; flex: none; align-self: center; }

  /* ---------- tags and badges ---------- */
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 560; line-height: 1;
    padding: 3px 7px 3px 6px; border-radius: 6px;
    color: var(--dim); background: var(--panel-2);
  }
  .tag .i { width: 12px; height: 12px; }
  .tag.k-approval { color: var(--blue); background: rgba(130,182,255,.1); }
  .tag.k-ask { color: var(--amber); background: var(--amber-soft); }
  .tag.k-errored, .tag.risky { color: var(--red); background: var(--red-soft); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 560; line-height: 1;
    padding: 3px 8px 3px 6px; border-radius: 99px; white-space: nowrap;
    color: var(--dim); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2);
  }
  .badge .i { width: 12px; height: 12px; }
  .badge.maybe { color: var(--violet); background: var(--violet-soft); box-shadow: inset 0 0 0 1px rgba(184,164,255,.3); }
  .badge.insession { color: var(--green); background: var(--green-soft); box-shadow: inset 0 0 0 1px rgba(106,212,155,.32); }
  .badge.super { color: var(--violet); }
  .badge.bad { color: var(--red); }

  /* ---------- done (recently closed) ---------- */
  #recent { border-top: 1px solid var(--line); max-height: 34%; display: flex; flex-direction: column; min-height: 0; }
  #recent[hidden] { display: none; }
  .recent-h {
    display: flex; align-items: center; gap: 8px; width: 100%;
    border: 0; background: none; color: var(--dim); text-align: left;
    padding: 10px 18px; font-size: 12px; font-weight: 600;
  }
  .recent-h:hover { color: var(--fg-2); }
  .recent-h .chev { transition: transform .2s var(--ease); }
  #recent.shut .chev { transform: rotate(-90deg); }
  #recent.shut #recent-list { display: none; }
  #recent-list { overflow: auto; padding: 0 6px 8px; }
  .recent-row {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
    padding: 7px 12px; border-radius: 8px; font-size: 13px;
  }
  .recent-row:hover { background: var(--hover); }
  .recent-row.opens { cursor: pointer; }
  .recent-row .who-line { color: var(--dim); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-row .who-line b { color: var(--fg-2); font-weight: 560; }
  .recent-row .how { display: inline-flex; align-items: center; gap: 6px; justify-self: end; }
  .recent-row .ago { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .recent-row .q { grid-column: 1 / -1; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- decision pane ---------- */
  #detail { padding: 28px 36px 8px; width: 100%; max-width: 860px; }
  .d-head { display: flex; gap: 14px; align-items: center; }
  .d-who { min-width: 0; }
  .d-who .name { font-weight: 650; font-size: 15px; }
  .d-who .name .host { font-weight: 450; }
  .d-meta { color: var(--dim); font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .d-meta .sep { color: var(--faint); }
  .d-meta .waiting { color: var(--amber); font-weight: 560; }
  .d-who .name { display: flex; align-items: center; gap: 8px; }
  .d-who .name .tag { margin-left: 4px; }
  .d-q {
    font-size: 21px; line-height: 1.35; font-weight: 600; letter-spacing: -.015em;
    margin: 22px 0 0; max-width: 62ch; text-wrap: pretty; overflow-wrap: anywhere;
  }
  .cmd {
    margin: 16px 0 0; padding: 14px 16px;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
    font: 13.5px/1.6 var(--mono); color: var(--fg);
    white-space: pre-wrap; overflow-wrap: anywhere;
    display: flex; gap: 10px;
  }
  .cmd .i { color: var(--faint); margin-top: 3px; }
  .note {
    display: flex; gap: 10px; align-items: flex-start;
    margin: 16px 0 0; padding: 11px 14px; border-radius: 10px; font-size: 13px;
    max-width: 62ch;
  }
  .note .i { margin-top: 2px; }
  .note.risk { color: var(--red); background: var(--red-soft); }
  .note.maybe { color: var(--violet); background: var(--violet-soft); }
  .note.maybe b, .note.risk b { color: var(--fg); font-weight: 600; }

  /* Attachments: references to files where they live, read when opened. */
  .files { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-width: 68ch; }
  .d-body .files { margin-top: 16px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb {
    position: relative; display: block; padding: 0; border: 1px solid var(--line-2); border-radius: 10px;
    overflow: hidden; background: var(--panel-2); cursor: zoom-in; max-width: 100%;
  }
  .thumb img { display: block; max-width: min(360px, 100%); max-height: 240px; object-fit: contain; background: #fff1; }
  .thumb .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 5px; font-size: 11.5px; color: var(--fg);
    background: linear-gradient(transparent, rgba(0,0,0,.72)); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thumb:hover { border-color: var(--dim); }
  .file {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 10px; border: 1px solid var(--line-2);
    border-radius: 10px; background: var(--panel); min-width: 0;
  }
  .file > .i { width: 18px; height: 18px; color: var(--dim); flex: none; }
  .file .fn { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .file .fn b { font-weight: 560; color: var(--fg); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file .fn span { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file .fa { display: flex; gap: 2px; flex: none; }
  .file .fa a, .file .fa button {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; color: var(--dim); cursor: pointer;
  }
  .file .fa a:hover, .file .fa button:hover, .file .fa button[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
  .file .fa .i { width: 16px; height: 16px; }
  .file.gone { opacity: .6; }
  .file.gone .fn b { text-decoration: line-through; }
  .ftag { font-size: 11px; padding: 1px 6px; border-radius: 99px; margin-left: 6px; font-weight: 520; }
  .ftag.changed { color: var(--amber); background: var(--amber-soft); }
  .ftag.gone { color: var(--red); background: var(--red-soft); }
  .peek {
    margin: -2px 0 0; padding: 10px 12px; max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg-2); font: 12.5px/1.5 var(--mono); color: var(--fg-2); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .peek .more { color: var(--faint); font-family: var(--sans); }
  #lightbox {
    position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto 1fr; background: rgba(5,6,8,.9);
    backdrop-filter: blur(4px);
  }
  #lightbox .lb-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: var(--fg-2); font-size: 13px; }
  #lightbox .lb-bar b { color: var(--fg); font-weight: 560; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lightbox .lb-bar a, #lightbox .lb-bar button { color: var(--fg-2); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 10px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font: inherit; text-decoration: none; }
  #lightbox .lb-bar .i { width: 14px; height: 14px; }
  #lightbox .lb-img { display: grid; place-items: center; padding: 0 16px 16px; min-height: 0; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; background: #fff1; }
  .note span { color: var(--fg-2); }
  .choices { display: grid; gap: 8px; margin-top: 22px; max-width: 520px; }
  .choice {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 11px;
    background: var(--panel); border: 1px solid var(--line-2); color: var(--fg);
    font-size: 14.5px; font-weight: 550; text-align: left;
    transition: border-color .12s, background .12s, transform .12s var(--ease);
  }
  .choice:hover { border-color: var(--amber); background: var(--panel-2); }
  .choice:active { transform: scale(.99); }
  .choice kbd { margin-left: auto; }
  .decide { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px;
    border: 1px solid var(--line-2); background: var(--panel); color: var(--fg);
    transition: filter .12s, background .12s, border-color .12s;
  }
  .btn:hover { background: var(--panel-2); border-color: #3a4048; }
  .btn kbd { background: rgba(0,0,0,.18); border-color: rgba(0,0,0,.25); color: inherit; opacity: .8; }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.allow { background: var(--green); border-color: var(--green); color: #062114; }
  .btn.allow:hover { filter: brightness(1.07); }
  .btn.allow.risky { background: transparent; color: var(--red); border-color: rgba(242,128,111,.6); }
  .btn.allow.risky:hover { background: var(--red-soft); filter: none; }
  .btn.deny { color: var(--red); }
  .btn.deny kbd, .btn.allow.risky kbd { background: var(--panel-2); border-color: var(--line-2); }
  .secondary { display: flex; gap: 4px; margin-top: 14px; flex-wrap: wrap; }
  .link {
    display: inline-flex; align-items: center; gap: 7px;
    border: 0; background: none; color: var(--dim); padding: 6px 8px; border-radius: 8px; font-size: 13px;
  }
  .link:hover { color: var(--fg); background: var(--hover); }
  .link kbd { font-size: 10.5px; }
  .link.del { margin-left: auto; }
  .link.del:hover { color: var(--red); background: var(--red-soft); }
  .closed-line { margin-top: 18px; display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 13px; }

  /* ---------- conversation ---------- */
  .convo { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); max-width: 760px; }
  .convo h3 { margin: 0 0 14px; font-size: 13px; font-weight: 600; color: var(--dim); }
  .thread-title { font-size: 19px; font-weight: 620; letter-spacing: -.012em; margin: 0 0 4px; }
  .thread-sub { color: var(--dim); font-size: 12.5px; margin-bottom: 22px; }
  .msg { display: grid; grid-template-columns: 32px 1fr; gap: 0 12px; margin-bottom: 18px; }
  .msg-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--dim); }
  .msg-h b { color: var(--fg); font-weight: 620; }
  .msg-h .t { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .trust { font-size: 11.5px; }
  .trust.v { color: var(--green); }
  .trust.s { color: var(--violet); }
  .trust.u { color: var(--faint); }
  .msg pre {
    margin: 5px 0 0; padding: 10px 13px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px;
    white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.55 var(--sans); color: var(--fg-2);
    max-width: 68ch;
  }
  .msg.me pre { background: rgba(243,179,64,.07); border-color: rgba(243,179,64,.22); }
  .sysnote { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12.5px; margin: 0 0 18px 44px; }
  .sysnote .i { width: 14px; height: 14px; color: var(--green); }
  .sysnote.maybe .i { color: var(--violet); }
  .back { margin-bottom: 18px; }

  /* ---------- mail scopes, agents, joining a thread ---------- */
  .scopes { display: flex; gap: 2px; align-items: center; padding: 8px 8px 6px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .scopes[hidden] { display: none; }
  .scopes > button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--dim); font: inherit; font-size: 12.5px; font-weight: 560; cursor: pointer; }
  .scopes > button:hover { color: var(--fg-2); background: var(--hover); }
  .scopes > button.on { color: var(--fg); background: var(--panel-2); }
  .follow-chip { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; padding: 3px 4px 3px 3px; border-radius: 99px; background: var(--amber-soft); color: var(--fg); font-size: 12.5px; font-weight: 560; }
  .follow-chip:empty { display: none; }
  .follow-chip .av, .person-chip .av, .to-pick .av { width: 22px; height: 22px; font-size: 9.5px; border-radius: 99px; }
  .follow-chip button { border: 0; background: transparent; color: var(--dim); cursor: pointer; display: grid; place-items: center; padding: 3px; border-radius: 99px; }
  .follow-chip button:hover { color: var(--fg); background: var(--hover); }

  .profile .stats { grid-column: 2; color: var(--dim); font-size: 12.5px; display: flex; gap: 12px; flex-wrap: wrap; }
  .profile .stats b { color: var(--fg); font-weight: 600; }
  .profile .stats .link { padding: 0; color: var(--amber); }
  .ring { width: 7px; height: 7px; border-radius: 99px; box-shadow: inset 0 0 0 1.5px var(--dim); flex: none; align-self: center; }

  .person-chip { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 3px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel); color: var(--fg-2); font: inherit; font-size: 12.5px; cursor: pointer; }

  .to-pick button[aria-pressed="true"] { border-color: rgba(243,179,64,.55); background: var(--amber-soft); color: var(--fg); }
  .to-pick button[aria-pressed="false"] .av { opacity: .45; }

  /* ---------- composer ---------- */
  #composer {
    position: sticky; bottom: 0;
    margin: auto 36px 20px; max-width: 788px;
    padding: 10px; border: 1px solid var(--line-2); border-radius: 14px;
    background: var(--panel);
    box-shadow: 0 12px 32px -12px rgba(0,0,0,.6);
    display: grid; gap: 8px;
  }
  #composer[hidden] { display: none; }
  #composer:focus-within { border-color: #4a4f57; }
  #composer.deny { border-color: rgba(242,128,111,.5); }
  #composer-label { color: var(--dim); font-size: 12px; padding: 0 4px; }
  #composer-text {
    width: 100%; min-height: 64px; max-height: 40vh; resize: vertical;

  }
  #composer-text::placeholder { color: var(--faint); }
  .composer-acts { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  .composer-acts .hint { margin-right: auto; color: var(--faint); font-size: 12px; padding-left: 4px; }

  /* ---------- empty ---------- */
  .empty { display: grid; place-items: center; text-align: center; color: var(--dim); padding: 64px 24px; gap: 6px; }
  .empty .glyph { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); margin-bottom: 8px; }
  .empty .glyph .i { width: 22px; height: 22px; }
  .empty strong { color: var(--fg); font-size: 16px; font-weight: 620; }
  #detail .empty { min-height: 60vh; }

  /* ---------- footer, toast ---------- */
  footer {
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    padding: 8px 16px; border-top: 1px solid var(--line); background: var(--bg-2);
    color: var(--faint); font-size: 12px;
  }
  footer span { display: inline-flex; gap: 6px; align-items: center; }
  #status {
    position: fixed; left: 50%; bottom: 52px; transform: translate(-50%, 12px);
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 550;
    background: #22262c; color: var(--fg); border: 1px solid var(--line-2);
    box-shadow: 0 16px 40px -12px rgba(0,0,0,.7);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .35s var(--ease);
  }
  #status.show { opacity: 1; transform: translate(-50%, 0); }
  #status.err { color: var(--red); }
  #status .i { color: var(--green); }
  #status.err .i { color: var(--red); }
  .mback { display: none; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 800px) {
    .top { gap: 8px; padding: 8px 10px; }
    .brand .word, .who, .live span, .ghost .lbl, .ghost kbd, footer { display: none; }
    .tabs button { padding: 5px 9px; gap: 5px; }
    .split { grid-template-columns: minmax(0, 1fr); }
    body.reading .left { display: none; }
    body:not(.reading) #read { display: none; }
    .mback { display: inline-flex; }
    #detail { padding: 16px 16px 8px; }
    .d-q { font-size: 19px; }
    #composer { margin: auto 12px 12px; }
    .join-bar { margin: auto 12px 12px; padding: 6px; border-style: solid; }
    .join-bar > .i, .join-bar > span { display: none; }
    .join-bar .btn { margin: 0; width: 100%; justify-content: center; }
    .choice { padding: 14px; }
  }
</style>

<script>
(() => {
  const $ = s => document.querySelector(s);
  let view = 'inbox', showAll = false, openThread = null, selected = 0;
  let items = [], threads = [], recent = [], me = 'human';
  // Who is live, from the daemon's adapter poll (SPEC §12a).
  let seen = {known: false, machine: '', agents: [], unknown: []};
  // Done starts folded while something waits, so the queue keeps the room.
  let recentOpen = null, convoFor = null;
  // Mail (D13): mailScope is me | agents | people; following narrows Mail
  // to one agent's threads. Mail between agents carries no new or unread
  // marks for the person (SPEC §12).
  let mailScope = 'me', following = null;

  // ---------- words ----------
  const icon = (id, cls) => `<svg class="i${cls ? ' ' + cls : ''}"><use href="#i-${id}"/></svg>`;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const localName = a => String(a||'').split('@')[0];
  const hostOf = a => { const s = String(a||''); const i = s.indexOf('@'); return i<0 ? '' : s.slice(i+1); };
  // Attachments are references: the page reads each file where it lives
  // when it is opened (/api/artifact), never a copy.
  const artURL = (mid, i, dl) => `/api/artifact?mid=${encodeURIComponent(mid)}&i=${i}${dl ? '&dl=1' : ''}`;
  const baseName = p => String(p || '').split('/').pop();
  const fsize = n => !n ? '0 B' : n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB` : `${(n / 1048576).toFixed(1)} MB`;
  const PICTURE = /^image\/(png|jpeg|gif|webp|avif|bmp|svg\+xml)$/;
  const TEXTISH = /\.(md|markdown|txt|log|out|diff|patch|json|jsonl|ya?ml|toml|ini|csv|tsv|go|py|js|mjs|ts|tsx|jsx|rs|rb|java|kt|swift|c|h|cc|cpp|sh|bash|zsh|sql|html?|xml|css|env)$/i;
  const fileKind = a => { const x = (baseName(a.path).match(/\.([^.]+)$/) || [])[1]; return x ? x.toUpperCase() : (a.media_type || 'file'); };
  function filesHTML(mid, atts) {
    if (!mid || !atts?.length) return '';
    const flag = a => a.missing ? '<span class="ftag gone">gone</span>'
      : a.changed ? '<span class="ftag changed" title="Modified after it was sent: this is how it looks now.">changed since sent</span>' : '';
    const pics = [], rest = [];
    atts.forEach((a, i) => {
      const name = esc(baseName(a.path));
      if (!a.missing && PICTURE.test(a.media_type || '')) {
        pics.push(`<button type="button" class="thumb" data-a="zoom" data-mid="${esc(mid)}" data-i="${i}" data-name="${name}" aria-label="View ${name}"><img loading="lazy" alt="${name}" src="${artURL(mid, i)}"><span class="cap">${name}${a.changed ? ' · changed since sent' : ''}</span></button>`);
        return;
      }
      const peekBtn = !a.missing && (/^text\//.test(a.media_type || '') || TEXTISH.test(a.path))
        ? `<button type="button" data-a="peek" data-mid="${esc(mid)}" data-i="${i}" aria-expanded="false" title="Preview" aria-label="Preview ${name}">${icon('eye')}</button>` : '';
      const acts = a.missing ? '' : `<span class="fa">${peekBtn}<a href="${artURL(mid, i)}" target="_blank" rel="noopener" title="Open in a new tab" aria-label="Open ${name}">${icon('ext')}</a><a href="${artURL(mid, i, true)}" title="Download" aria-label="Download ${name}">${icon('download')}</a></span>`;
      rest.push(`<div class="file${a.missing ? ' gone' : ''}">${icon('file')}<span class="fn"><b title="${esc(a.path)}">${name}${flag(a)}</b><span>${esc(fileKind(a))} · ${fsize(a.bytes)} · ${esc(a.path)}</span></span>${acts}</div>`);
    });
    return `<div class="files" aria-label="attachments">${pics.length ? `<div class="thumbs">${pics.join('')}</div>` : ''}${rest.join('')}</div>`;
  }
  // peek shows the start of a text file under it, read with a range.
  const PEEK = 32768;
  async function peek(b) {
    const file = b.closest('.file');
    const open = b.getAttribute('aria-expanded') === 'true';
    if (file.nextElementSibling?.classList.contains('peek')) file.nextElementSibling.remove();
    b.setAttribute('aria-expanded', String(!open));
    if (open) return;
    const pre = document.createElement('pre');
    pre.className = 'peek';
    pre.textContent = 'Loading…';
    file.after(pre);
    try {
      const r = await fetch(artURL(b.dataset.mid, b.dataset.i), {headers: {Range: `bytes=0-${PEEK - 1}`}, credentials: 'same-origin'});
      if (!r.ok) throw new Error(r.status === 404 ? 'The file is gone.' : `Could not read it (HTTP ${r.status}).`);
      pre.textContent = await r.text();
      const total = +((r.headers.get('Content-Range') || '').split('/')[1] || 0);
      if (total > PEEK) pre.insertAdjacentHTML('beforeend', `<span class="more">\n… ${fsize(total - PEEK)} more: open it for the whole file.</span>`);
    } catch (err) { pre.textContent = err.message; }
  }
  // zoom shows a picture full size on top of the page.
  function zoom(mid, i, name) {
    closeZoom();
    zoom.from = document.activeElement;
    const lb = document.createElement('div');
    lb.id = 'lightbox';
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    lb.setAttribute('aria-label', name);
    lb.innerHTML = `<div class="lb-bar"><b>${esc(name)}</b><a href="${artURL(mid, i)}" target="_blank" rel="noopener">${icon('ext')}Open</a><a href="${artURL(mid, i, true)}">${icon('download')}Download</a><button type="button" class="lb-close">${icon('x')}Close <kbd>esc</kbd></button></div><div class="lb-img"><img alt="${esc(name)}" src="${artURL(mid, i)}"></div>`;
    lb.addEventListener('click', e => {
      if (e.target === lb || e.target.classList.contains('lb-img') || e.target.closest('.lb-close')) closeZoom();
    });
    document.body.append(lb);
    lb.querySelector('.lb-close').focus();
  }
  function closeZoom() {
    const lb = $('#lightbox');
    if (!lb) return false;
    lb.remove();
    zoom.from?.focus?.();
    return true;
  }
  const ago = ns => { const d = Math.max(0, Date.now() - ns/1e6)/1000; return d<60?`${d|0}s`:d<3600?`${d/60|0}m`:d<86400?`${d/3600|0}h ${String((d/60|0)%60).padStart(2,'0')}m`:`${d/86400|0}d`; };
  const heat = ns => { const m = (Date.now() - ns/1e6)/60000; return m >= 30 ? 'hot' : m >= 5 ? 'warm' : ''; };
  const hhmm = ns => new Date(ns/1e6).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
  const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const initials = name => { const p = localName(name).split(/[-_.:\s]+/).filter(Boolean); return ((p[0]||'?')[0] + (p[1] ? p[1][0] : (p[0]||'')[1] || '')).toUpperCase(); };
  const avatar = (who, lg) => localName(who) === 'human'
    ? `<span class="av human${lg?' lg':''}">you</span>`
    : `<span class="av${lg?' lg':''}" style="--h:${hue(localName(who))}">${esc(initials(who))}</span>`;
  const isHuman = a => localName(a) === 'human';
  // A thread is the person's when it started from or to them; one the
  // person stepped into later stays between agents.
  const toMe = t => isHuman(t.from) || isHuman(t.to);
  const agentsOf = t => (t.people && t.people.length ? t.people : [t.from, t.to, t.last_from]).filter(a => a && !isHuman(a));
  const sameAgent = (a, b) => String(a||'').toLowerCase() === String(b||'').toLowerCase();
  // Mail to an agent on another machine is marked when its machine has it,
  // not when the agent read it (the hub cannot know).
  const receipt = (to, readAt) => !to || isHuman(to) ? ''
    : hostOf(to) ? (readAt ? `<span class="rcpt done">${icon('check')}delivered to ${esc(hostOf(to))}</span>` : `<span class="rcpt"><span class="ring"></span>on its way to ${esc(hostOf(to))}</span>`)
    : (readAt ? `<span class="rcpt done">${icon('check')}read ${hhmm(readAt)}</span>` : `<span class="rcpt"><span class="ring"></span>not read yet</span>`);
  const agentName = a => `<span class="agent">${esc(localName(a))}</span>${hostOf(a) ? `<span class="host">@${esc(hostOf(a))}</span>` : ''}`;
  const KIND = {
    approval: ['Permission', 'shield', 'k-approval'],
    ask: ['Question', 'ask', 'k-ask'],
    ask_human: ['Question', 'ask', 'k-ask'],
    errored: ['Agent error', 'alert', 'k-errored'],
  };
  const kindTag = it => { const [l, ic, c] = KIND[it.kind] || [it.kind, 'ask', '']; return `<span class="tag ${c}">${icon(ic)}${l}</span>`; };
  const question = it => it.kind === 'approval' ? `${it.subject||'Tool'}: ${it.question}` : it.question;
  // How an item closed, as the TUI says it (SPEC §7a).
  const closedHow = it => {
    const sup = String(it.decided_by||'').startsWith('supervisor:');
    if (it.closed_by === 'in_session') return 'in session';
    if (it.closed_by === 'answered') {
      if (it.kind === 'approval' && (it.answer === 'allow' || it.answer === 'deny')) return (it.answer === 'allow' ? 'allowed' : 'denied') + (sup ? ' by ' + it.decided_by.slice(11) : '');
      return sup ? 'by ' + it.decided_by : 'by you';
    }
    if (it.closed_by === 'dismissed') return sup ? 'dismissed by ' + it.decided_by : 'dismissed';
    if (it.closed_by === 'timeout') return 'timed out';
    if (it.closed_by === 'resolved') return 'agent moved on';
    if (it.closed_by === 'withdrawn') return 'withdrawn by ' + it.from;
    return it.closed_by || 'closed';
  };
  const maybeBadge = `<span class="badge maybe">${icon('maybe')}maybe answered in session</span>`;
  const inSessionBadge = `<span class="badge insession">${icon('term')}answered in session</span>`;
  // closedState is how a closed item reads, always as a badge; the person
  // answering in the agent's own session gets its own (SPEC §7a).
  const closedState = it => {
    if (it.closed_by === 'in_session') return inSessionBadge;
    const how = closedHow(it);
    const cls = String(it.decided_by||'').startsWith('supervisor:') ? ' super' : (it.closed_by === 'timeout' || it.answer === 'deny') ? ' bad' : '';
    const ic = it.closed_by === 'answered' ? 'check' : it.closed_by === 'timeout' ? 'history' : 'x';
    return `<span class="badge${cls}">${icon(ic)}${esc(how)}</span>`;
  };

  // ---------- plumbing ----------
  const typing = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); };
  const api = async (path, body) => {
    const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {});
    if (r.status === 401) { location.reload(); return null; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  };
  let toastTimer;
  const status = (m, err) => {
    const el = $('#status');
    if (!m) { el.classList.remove('show'); return; }
    el.innerHTML = icon(err ? 'alert' : 'check') + esc(m);
    el.classList.toggle('err', !!err);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), err ? 5000 : 2200);
  };
  const filters = () => ({
    unread: $('#f-unread').checked,
    who: $('#f-who').value.trim().toLowerCase(),
    session: $('#f-session').value.trim().toLowerCase(),
    machine: $('#f-machine').value.trim().toLowerCase(),
  });
  const matchWho = (addrs, who) => !who || addrs.some(a => localName(a).toLowerCase().includes(who));
  const matchHost = (addrs, host) => !host || addrs.some(a => hostOf(a).toLowerCase() === host);
  const visibleThreads = () => {
    const f = filters();
    return threads.filter(t => {
      if (following) { if (!agentsOf(t).some(a => sameAgent(a, following))) return false; }
      else if (mailScope === 'me' ? !toMe(t) : toMe(t)) return false;
      if (f.unread && !t.unread_mine) return false;
      if (!matchWho([t.from, t.to, t.last_from, ...(t.people || [])], f.who)) return false;
      if (f.session && String(t.session||'').toLowerCase() !== f.session) return false;
      if (!matchHost([t.from, t.to, t.last_from], f.machine)) return false;
      return true;
    });
  };
  const visibleItems = () => {
    const f = filters();
    return items.filter(it => {
      if (!matchWho([it.from], f.who)) return false;
      if (f.session && String(it.session||'').toLowerCase() !== f.session) return false;
      if (!matchHost([it.from], f.machine)) return false;
      return true;
    });
  };
  // liveness: live (listed now, by name or pane id), closed (with when it
  // was last seen, 0 when the daemon restarted since), or unknown (another
  // machine, a token-held name, no adapter).
  const liveness = a => {
    const host = hostOf(a);
    if (!seen.known || (host && host !== seen.machine)) return {s: 'unknown'};
    const n = localName(a).toLowerCase();
    const hits = (seen.agents || []).filter(x => [x.principal, x.name, x.pane_id].some(v => v && String(v).toLowerCase() === n));
    if (hits.some(x => x.live)) return {s: 'live'};
    if ((seen.unknown || []).some(u => String(u).toLowerCase() === n)) return {s: 'unknown'};
    return {s: 'closed', at: Math.max(0, ...hits.map(x => x.last_seen || 0))};
  };
  const closedText = lv => lv.at ? `closed ${ago(lv.at)} ago` : 'closed';
  // Every agent seen in Mail or the Inbox: live ones first, then busiest.
  const agentsList = () => {
    const by = new Map();
    const get = a => { const k = a.toLowerCase(); if (!by.has(k)) by.set(k, {addr: a, threads: 0, last: 0, waiting: 0, mine: 0}); return by.get(k); };
    for (const t of threads) for (const a of agentsOf(t)) {
      const g = get(a); g.threads++; g.last = Math.max(g.last, t.last_at || 0);
      if (t.unread_mine && sameAgent(t.from, a)) g.mine++;
    }
    for (const it of items) if (!it.closed_at && it.from && !isHuman(it.from)) { const g = get(it.from); g.waiting++; g.last = Math.max(g.last, it.opened_at || 0); }
    const f = filters();
    for (const g of by.values()) g.live = liveness(g.addr);
    const rank = g => g.live.s === 'live' ? 0 : 1;
    return [...by.values()].filter(g => matchWho([g.addr], f.who) && matchHost([g.addr], f.machine)).sort((a, b) => rank(a) - rank(b) || b.last - a.last);
  };
  const mailRows = () => view === 'mail' && mailScope === 'people' && !following ? agentsList() : visibleThreads();
  const current = () => view === 'inbox' ? visibleItems()[selected] : null;
  const reading = on => document.body.classList.toggle('reading', !!on);

  // ---------- composer ----------
  const hideComposer = () => { $('#composer').hidden = true; $('#composer').classList.remove('deny'); $('#composer-deny').hidden = true; $('#composer-send').hidden = false; $('#to-pick').hidden = true; $('#joinbar').hidden = true; $('#composer').dataset.mode = ''; };
  const showComposer = (label, placeholder, mode, data) => {
    const form = $('#composer');
    form.hidden = false;
    form.classList.toggle('deny', mode === 'deny');

    $('#composer-text').placeholder = placeholder;
    $('#composer-deny').hidden = mode !== 'deny';
    $('#composer-send').hidden = mode === 'deny';
    form.dataset.mode = mode;
    Object.assign(form.dataset, data || {});
  };

  // ---------- footer keys ----------
  const keys = () => {
    const k = (key, does) => `<span><kbd>${key}</kbd>${does}</span>`;
    let parts;
    const joining = !$('#joinbar').hidden || $('#composer').dataset.mode === 'join';

    else if (mailScope === 'people' && !following) parts = [k('j','next'), k('k','previous'), k('↵','follow'), k('t','next tab')];

    $('#keys').innerHTML = parts.join('') + k('i','waiting') + k('m','mail') + k('/','filter');

  // ---------- list ----------
  function renderTabs() {
    const set = (el, on) => { el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); };
    set($('#tab-inbox'), view === 'inbox' && !showAll);
    set($('#all'), view === 'inbox' && showAll);

    const openN = items.filter(i => !i.closed_at).length;
    $('#count').textContent = openN || '';
    // Mail counts only what is unread by you; agents' unread is theirs.

    $('#mail-count').textContent = unread || '';
    $('#n-me').textContent = unread || '';
    $('#scopes').hidden = view !== 'mail';
    for (const b of document.querySelectorAll('.scopes > button')) {

    }
    $('#follow').innerHTML = following ? `${avatar(following)}<span>${esc(following)}</span><button type="button" data-a="unfollow" title="Stop following (esc)" aria-label="Stop following">${icon('x')}</button>` : '';
    document.title = openN ? `(${openN}) mailai` : 'mailai';

  }

  function itemRow(it, i) {
    const on = i === selected;
    const isApproval = it.kind === 'approval';
    const q = isApproval ? `<code>${esc(it.question)}</code>` : esc(it.question);
    const tags = [kindTag(it)];
    if (isApproval && it.subject) tags[0] = `<span class="tag k-approval">${icon('shield')}${esc(it.subject)}</span>`;
    if (it.risky) tags.push(`<span class="tag risky">${icon('alert')}risky</span>`);
    if (it.session) tags.push(`<span class="tag">${esc(it.session)}</span>`);
    if (it.attachments?.length) tags.push(`<span class="tag" title="attached files">${icon('clip')}${it.attachments.length}</span>`);
    if (it.closed_at) tags.push(closedState(it));
    else if (it.maybe_in_session_at) tags.push(maybeBadge);
    const age = it.closed_at ? `<span class="age">${ago(it.closed_at)}</span>` : `<span class="age ${heat(it.opened_at)}">${ago(it.opened_at)}</span>`;
    return `<button class="row${on?' on':''}${it.closed_at?' closed':''}" role="option" aria-selected="${on}" data-i="${i}">${avatar(it.from)}<span class="r-body"><span class="r-top">${agentName(it.from)}${age}</span><span class="r-q">${q}</span><span class="r-tags">${tags.join('')}</span></span></button>`;
  }
  function threadRow(t, i) {
    const on = i === selected;
    const fromMe = isHuman(t.from);
    const other = fromMe ? t.to : t.from;
    // Only the person's own unread is marked; an agent's is its business.
    const dot = t.unread_mine ? '<span class="unread-dot" title="unread"></span>' : '';

    const tags = [];
    if (t.count > 1) tags.push(`<span class="tag">${icon('thread')}${t.count}</span>`);
    if (t.files) tags.push(`<span class="tag" title="attached files">${icon('clip')}${t.files}</span>`);
    if (between && (t.people || []).some(isHuman)) tags.push(`<span class="tag joined">${icon('join')}you stepped in</span>`);
    const people = fromMe
      ? `<span class="agent">You</span><span class="host">→ ${esc(t.to || 'session ' + (t.session||''))}</span>`
      : `${agentName(t.from)}${withPane(t.from, t.from_pane)}<span class="host">→ ${localName(t.to) === 'human' ? 'you' : esc(t.to || 'session ' + (t.session||''))}</span>`;

  const agentStats = g => [
    g.live?.s === 'live' ? '<span><span class="live-dot"></span> live</span>' : g.live?.s === 'closed' ? `<span>${closedText(g.live)}</span>` : '',
    `<span><b>${g.threads}</b> thread${g.threads === 1 ? '' : 's'}</span>`,

  ].filter(Boolean);
  function agentRow(g, i) {
    const on = i === selected;

  function profileHTML(who) {

  }

  function renderList() {
    const list = $('#list');
    const people = view === 'mail' && mailScope === 'people' && !following;
    const data = view === 'inbox' ? visibleItems() : mailRows();
    if (selected >= data.length) selected = Math.max(0, data.length - 1);
    renderTabs();
    const head = view === 'mail' && following ? profileHTML(following) : '';
    if (!data.length) {
      const filtered = (() => { const f = filters(); return f.who || f.session || f.machine || f.unread; })();
      const [title, sub] = view === 'inbox'
        ? (filtered ? ['Nothing matches', 'Clear the filter to see everything waiting.'] : ['Nothing is waiting on you', 'Questions, permissions and agent errors land here.'])
        : filtered ? ['Nothing matches', 'Clear the filter to see more.']
        : following ? [`No mail with ${esc(localName(following))}`, 'Threads it sends or receives show up here.']
        : mailScope === 'me' ? ['Nothing to you yet', 'Mail your agents send you lands here. Questions that need an answer go to Waiting.']
        : mailScope === 'agents' ? ['No mail between agents', 'When your agents write to each other, you can read along here and step in.']
        : ['No agents yet', 'Agents show up once they send or receive mail.'];

  // Recently closed: newest first, not selectable (SPEC §7a).
  function renderRecent() {
    const show = view === 'inbox' && !showAll && recent.length > 0;

      const row = held ? `class="recent-row opens" data-a="open" data-id="${esc(it.thread_id)}" title="Open thread"` : 'class="recent-row"';
      return `<div ${row}><span class="who-line"><b>${esc(localName(it.from))}</b>${hostOf(it.from) ? '@' + esc(hostOf(it.from)) : ''}</span><span class="how">${closedState(it)}<span class="ago">${ago(it.closed_at)}</span></span><span class="q">${esc(question(it))}</span></div>`;
    }).join('');
  }

  // ---------- detail ----------
  // The pane a pane-proven sender was in, beside its name, so a name that
  // moved to another pane shows (§9). Nothing when the name is the pane.
  function withPane(addr, pane) {
    return pane && pane !== addr ? `<span class="host pane">· ${esc(pane)}</span>` : '';
  }
  function trustOf(m) {
    if (m.verified) return `<span class="trust ${m.verified === 'human' ? 'v' : 's'}">${icon('check')} verified ${esc(String(m.verified).replace(':', ' '))}</span>`;
    if (m.claimed_human) return '<span class="trust u">automated reply</span>';
    return `<span class="trust u">${esc(m.sender_proof || 'unplaced')}</span>`;
  }
  // One bubble per message; the person's same words to several agents in
  // one go (joining a thread between agents) read as one bubble.
  function groupMessages(messages) {
    const out = [];
    for (const m of messages || []) {
      const prev = out[out.length - 1];
      if (prev && isHuman(m.from) && isHuman(prev.from) && prev.text === m.text && Math.abs((m.sent_at||0) - (prev.sent_at||0)) < 10e9) {
        prev.tos.push([m.to, m.read_at]);
        continue;
      }
      out.push({...m, tos: [[m.to, m.read_at]]});
    }
    return out;
  }
  function messagesHTML(messages, thItems, between) {
    const msgs = groupMessages(messages).map(m => {
      const mine = isHuman(m.from);
      const to = m.tos.map(([a]) => a).filter(Boolean);
      // One recipient: its receipt in the header. Several: a line each,
      // under the bubble.
      const many = m.tos.length > 1;
      const head = many ? '' : receipt(m.tos[0][0], m.tos[0][1]);
      const under = many ? `<div class="rcpts">${m.tos.map(([a, r]) => `<span class="rcpt"><b>${esc(localName(a))}</b>${receipt(a, r)}</span>`).join('')}</div>` : '';
      return `<div class="msg${mine ? ' me' : ''}">${avatar(m.from)}<div><div class="msg-h"><b>${mine ? 'You' : esc(localName(m.from))}</b>${hostOf(m.from) ? `<span class="host">@${esc(hostOf(m.from))}</span>` : ''}${withPane(m.from, m.sender_pane)}${mine && between ? '<span class="stepped">stepped in</span>' : ''}${trustOf(m)}${to.length ? `<span>→ ${to.map(a => isHuman(a) ? 'you' : esc(a)).join(', ')}</span>` : ''}<span class="t">${m.sent_at ? hhmm(m.sent_at) : ''}</span>${head}</div><pre>${esc(m.text)}</pre>${filesHTML(m.mid, m.attachments)}${under}</div></div>`;
    }).join('');
    // One-line notes from the thread's items, never stored messages (§7a).
    const notes = (thItems || []).map(it =>
      it.closed_by === 'in_session' ? `<p class="sysnote">${icon('term')}#${it.id} answered in the session at ${hhmm(it.closed_at)}</p>`
      : it.closed_by === 'withdrawn' ? `<p class="sysnote">${icon('x')}#${it.id} withdrawn by ${esc(it.from)} at ${hhmm(it.closed_at)}</p>`
      : (!it.closed_at && it.maybe_in_session_at) ? `<p class="sysnote maybe">${icon('maybe')}#${it.id} maybe answered in the session at ${hhmm(it.maybe_in_session_at)}</p>` : '').join('');
    return msgs + notes;
  }

  async function loadConvo(it) {
    const box = $('#convo');
    if (!box || !it.thread_id) return;
    const want = it.thread_id;
    convoFor = want;
    try {
      const th = await api('/api/thread?id=' + encodeURIComponent(want));
      if (!th || convoFor !== want || !$('#convo')) return;
      markRead(th.messages, want);
      // The question itself is already the heading: show the rest.
      const msgs = (th.messages || []).filter(m => m.mid !== it.mid);
      const others = (th.items || []).filter(x => x.id !== it.id);
      const body = messagesHTML(msgs, others);
      if (!body) { $('#convo').remove(); return; }
      $('#convo').innerHTML = `<h3>Earlier in this thread</h3>` + body;
    } catch { /* the item still shows */ }
  }

  function renderItem(it) {
    const detail = $('#detail');
    threadSeq++; // a thread still loading must not draw over the item
    hideComposer();
    if (!it) {
      detail.innerHTML = `<div class="empty"><span class="glyph">${icon('check')}</span><strong>All clear</strong>Nothing waits on you. New questions show up here the moment an agent asks.</div>`;
      return;
    }
    const isApproval = it.kind === 'approval';
    const meta = [
      it.session && `session ${esc(it.session)}`,
      it.harness && esc(it.harness),
      it.closed_at ? `closed ${ago(it.closed_at)} ago` : `<span class="waiting">waiting ${ago(it.opened_at)}</span>`,
    ].filter(Boolean).join('<span class="sep">·</span>');
    const head = `<button type="button" class="link mback back" data-a="mback">${icon('back')}Back</button><div class="d-head">${avatar(it.from, true)}<div class="d-who"><div class="name"><span>${agentName(it.from)}</span>${kindTag(it)}</div><div class="d-meta">${meta}</div></div></div>`;
    let body = '';
    if (isApproval) {
      body = `<h2 class="d-q">${it.closed_at ? 'Asked' : 'Wants'} to use ${esc(it.subject || 'a tool')}</h2><pre class="cmd">${icon('term')}<span>${esc(it.question)}</span></pre>`;
      if (it.risky) body += `<div class="note risk">${icon('alert')}<div><b>Marked risky</b> <span>by ${esc(it.harness || 'the harness')}. Read it before you allow it.</span></div></div>`;
    } else {
      body = `<h2 class="d-q">${esc(it.question)}</h2>`;
    }
    body += filesHTML(it.mid, it.attachments);
    if (!it.closed_at && it.maybe_in_session_at) {
      body += `<div class="note maybe">${icon('maybe')}<div><b>Maybe answered in session</b> <span>at ${hhmm(it.maybe_in_session_at)}: the agent moved on after a prompt. Still open: answer anyway, or <kbd>d</kbd> dismiss.</span></div></div>`;
    }
    let acts = '';
    if (!it.closed_at) {
      if (isApproval) {
        acts = `<div class="decide"><button class="btn allow${it.risky ? ' risky' : ''}" data-a="answer" data-id="${it.id}" data-t="allow">${icon('check')}Allow ${esc(it.subject || '')} <kbd>a</kbd></button><button class="btn deny" data-a="deny" data-id="${it.id}">${icon('x')}Deny <kbd>d</kbd></button></div>`;
      } else if (it.options?.length) {
        acts = `<div class="choices">${it.options.map((o, n) => `<button class="choice" data-a="answer" data-id="${it.id}" data-t="${esc(o)}">${esc(o)}<kbd>${n+1}</kbd></button>`).join('')}</div>`;
      } else {
        showComposer(`Answer ${localName(it.from)}`, 'Write your answer', 'answer', {id: it.id});
      }
      acts += `<div class="secondary"><button class="link" data-a="dismiss" data-id="${it.id}">${icon('x')}Dismiss <kbd>x</kbd></button>${it.thread_id ? `<button class="link" data-a="open" data-id="${esc(it.thread_id)}">${icon('thread')}Open thread <kbd>↵</kbd></button>` : ''}${it.from && !isHuman(it.from) ? `<button class="link" data-a="follow" data-who="${esc(it.from)}">${icon('user')}All mail with ${esc(localName(it.from))} <kbd>p</kbd></button>` : ''}</div>`;
    } else {
      acts = `<div class="closed-line">${closedState(it)}<span>${hhmm(it.closed_at)}</span></div>`;
      if (it.thread_id) acts += `<div class="secondary"><button class="link" data-a="open" data-id="${esc(it.thread_id)}">${icon('thread')}Open thread <kbd>↵</kbd></button></div>`;
    }
    detail.innerHTML = head + body + acts + (it.thread_id ? '<section class="convo" id="convo"></section>' : '');
    loadConvo(it);
  }

  // markRead marks the person's own unread mail in a thread read, so the
  // Mail count is what you have not seen. An agent's mail is its own.
  function markRead(messages, threadId) {
    const ids = (messages || []).filter(m => isHuman(m.to) && !m.read_at).map(m => m.id);
    if (!ids.length) return;
    api('/api/mark-read', {ids}).then(() => {
      const t = threads.find(x => x.thread_id === threadId);
      if (t) { t.unread = Math.max(0, (t.unread || 0) - ids.length); t.unread_mine = 0; }
      renderTabs();
      if (view === 'mail' && !openThread) renderList();
    }).catch(() => {});
  }
  // threadAgents are the agents in a thread, first sender first.
  const threadAgents = messages => {
    const out = [];
    for (const m of messages) for (const a of [m.from, m.to]) if (a && !isHuman(a) && !out.some(x => sameAgent(x, a))) out.push(a);
    return out;
  };
  let joinFor = null, threadSeq = 0;
  async function renderThread(id, full) {
    // Only the newest load may draw: an older one finishing late would
    // show one thread with another thread's reply box.
    const seq = ++threadSeq;
    const th = await api('/api/thread?id=' + encodeURIComponent(id));
    if (!th || seq !== threadSeq) return;
    const messages = th.messages || [];
    const first = messages[0] || {};
    const between = !!first.from && !isHuman(first.from) && !isHuman(first.to);
    const agents = threadAgents(messages);
    const back = full ? `<button type="button" class="link back" data-a="back">${icon('back')}Back <kbd>esc</kbd></button>` : `<button type="button" class="link mback back" data-a="mback">${icon('back')}Back</button>`;
    const firstLine = String(first.text || '').split('\n')[0];
    const title = first.subject || (firstLine.length > 90 ? firstLine.slice(0, 89) + '…' : firstLine) || 'Thread';
    const chips = agents.map(a => `<button type="button" class="person-chip" data-a="follow" data-who="${esc(a)}" title="All mail with ${esc(a)}">${avatar(a)}${esc(a)}</button>`).join('');
    const sub = `<div class="people"><span class="lbl">${between ? 'Between' : 'With'}</span>${chips}<span class="lbl">· ${messages.length} message${messages.length === 1 ? '' : 's'}</span><button type="button" class="link del" data-a="delete-thread" data-id="${esc(id)}" data-n="${messages.length}" title="Delete this thread">${icon('trash')}Delete</button></div>`;
    $('#detail').innerHTML = `${back}<h2 class="thread-title">${esc(title)}</h2>${sub}` + messagesHTML(messages, th.items, between);
    markRead(messages, id);
    const last = messages[messages.length - 1];
    if (between && last) {
      // Reading along by default; the person steps in on purpose (D13).
      joinFor = {mid: last.mid, agents};
      if ($('#composer').dataset.mode === 'join' && !$('#composer').hidden && $('#composer').dataset.mid === last.mid) { keys(); return; }
      hideComposer();
      const names = agents.map(a => `<b>${esc(a)}</b>`).join(agents.length === 2 ? ' and ' : ', ');
      $('#joinbar').innerHTML = `${icon('bot')}<span>Your agents ${names} are talking. Step in if they need a hand.</span><button type="button" class="btn" data-a="join">${icon('join')}Join thread as you <kbd>r</kbd></button>`;
      $('#joinbar').hidden = false;
    } else {
      joinFor = null;
      const lastAgent = [...messages].reverse().find(m => !isHuman(m.from)) || first;
      if (lastAgent && lastAgent.mid) showComposer(`Reply to ${localName(lastAgent.from)}`, 'Write a reply, signed as you', 'reply', {mid: lastAgent.mid, to: lastAgent.from});
      else hideComposer();
    }
    keys();
  }
  // startJoin opens the composer to write into a thread between agents, to
  // all of them unless the person picks.
  function startJoin() {
    if (!joinFor) return;
    $('#joinbar').hidden = true;
    showComposer('Join thread as you', 'Write to them. It arrives as mail from you, marked verified.', 'join', {mid: joinFor.mid});
    const pick = $('#to-pick');
    pick.innerHTML = `<span class="lbl">To</span>` + joinFor.agents.map(a => `<button type="button" aria-pressed="true" data-to="${esc(a)}">${avatar(a)}${esc(a)}</button>`).join('');
    pick.hidden = false;
    $('#composer-text').focus();
    keys();
  }

  async function renderDetail() {
    keys();
    if (openThread) return renderThread(openThread, true);
    if (view === 'inbox') return renderItem(visibleItems()[selected]);
    if (mailScope === 'people' && !following) return renderAgentCard(agentsList()[selected]);
    const t = visibleThreads()[selected];
    if (!t) { threadSeq++; hideComposer(); $('#detail').innerHTML = `<div class="empty"><span class="glyph">${icon('mail')}</span><strong>No thread selected</strong>Pick one on the left.</div>`; return; }
    return renderThread(t.thread_id, false);
  }

  // The Agents tab: who an agent is in Mail, and its latest threads.
  function renderAgentCard(g) {
    threadSeq++;
    hideComposer();
    if (!g) { $('#detail').innerHTML = `<div class="empty"><span class="glyph">${icon('users')}</span><strong>No agents yet</strong>Agents show up once they send or receive mail.</div>`; return; }
    const mine = threads.filter(t => agentsOf(t).some(a => sameAgent(a, g.addr))).slice(0, 6);
    const line = t => {
      const other = agentsOf(t).find(a => !sameAgent(a, g.addr));
      const who = toMe(t) ? (isHuman(t.from) ? 'you →' : '→ you') : `⇄ ${esc(localName(other || ''))}`;
      return `<button type="button" data-a="open" data-id="${esc(t.thread_id)}"><span class="who">${who}</span><span class="what">${esc(t.subject || t.first || 'Thread')}</span><span class="age">${ago(t.last_at)}</span></button>`;
    };
    $('#detail').innerHTML = `<button type="button" class="link mback back" data-a="mback">${icon('back')}Back</button><div class="agent-card"><div class="d-head">${avatar(g.addr, true)}<div class="d-who"><div class="name">${agentName(g.addr)}</div><div class="d-meta">${agentStats(g).join('<span class="sep">·</span>')}</div></div></div><div class="decide"><button class="btn primary" data-a="follow" data-who="${esc(g.addr)}">${icon('user')}Follow ${esc(localName(g.addr))} <kbd>↵</kbd></button>${g.waiting ? `<button class="btn" data-a="waiting-of" data-who="${esc(g.addr)}">${icon('inbox')}${g.waiting} waiting on you</button>` : ''}</div>${mine.length ? `<div class="recent-threads">${mine.map(line).join('')}</div>` : ''}</div>`;
  }

  async function render() {
    if (typing()) { render.pending = true; return; }
    try {
      const [inbox, mail, closed, live] = await Promise.all([api('/api/inbox' + (showAll ? '?all=1' : '')), api('/api/threads'), api('/api/inbox?closed=1'), api('/api/agents').catch(() => null)]);
      if (!inbox || !mail || !closed) return;
      if (live) seen = live;
      // Keep the selection on the same thing when the order changes.
      // Items have opened_at; thread rows a thread_id; agents an addr.
      const keyOf = r => r && (r.opened_at ? 'i' + r.id : r.thread_id ? 't' + r.thread_id : r.addr ? 'a' + r.addr : null);
      const was = keyOf((view === 'inbox' ? visibleItems() : mailRows())[selected]);
      items = inbox.items || [];
      threads = mail.threads || [];
      recent = closed.items || [];
      if (was) {
        const i = (view === 'inbox' ? visibleItems() : mailRows()).findIndex(r => keyOf(r) === was);
        if (i >= 0) selected = i;
      }
      renderList();
      renderRecent();
      await renderDetail();
    } catch (e) { status(e.message, true); }
  }

  const ACTED = {allow: 'Allowed', deny: 'Denied'};
  const act = async (path, body, done) => {
    try { await api(path, body); status(done || 'Done'); await render(); }
    catch (e) { status(e.message, true); }
  };
  const answer = (it, text) => act('/api/answer', {item: it.id ?? it, text}, ACTED[text] ? `${ACTED[text]} · ${localName(it.from || '')}` : `Answered “${text}”`);
  const startDeny = id => {
    showComposer('Why not? The agent sees this', 'Optional reason. Enter denies.', 'deny', {id});
    $('#composer-text').focus();
  };
  const select = async i => {
    selected = i;
    renderList();
    reading(true);
    await renderDetail();
  };
  const go = async (v, all) => { view = v; showAll = !!all; openThread = null; following = null; selected = 0; reading(false); await render(); };
  const setScope = async s => {
    view = 'mail'; mailScope = s; following = null; openThread = null; selected = 0; reading(false);
    await render();
  };
  const follow = async who => {
    if (!who) return;
    view = 'mail'; following = who; openThread = null; selected = 0;
    reading(false);
    await render();
  };
  const unfollow = async () => { following = null; selected = 0; await render(); };
  // waitingOf shows the Waiting list for one agent.
  const waitingOf = async who => {
    $('#f-who').value = localName(who);
    await go('inbox', false);
  };
  // followTarget is the agent a key press of p means right now.
  const followTarget = () => {
    if (view === 'inbox') { const it = current(); return it && !isHuman(it.from) ? it.from : null; }
    if (mailScope === 'people' && !following) return agentsList()[selected]?.addr;
    const t = visibleThreads()[selected];
    if (!t) return null;
    return isHuman(t.from) ? t.to : t.from;
  };

  // ---------- events ----------
  document.addEventListener('click', async e => {
    const row = e.target.closest('.row');
    if (row) return select(+row.dataset.i);
    const sc = e.target.closest('.scopes > button');
    if (sc) return setScope(sc.dataset.scope);
    const tp = e.target.closest('#to-pick button');
    if (tp) {
      const on = tp.getAttribute('aria-pressed') !== 'true';
      // Never zero recipients: turning the last one off is refused.
      if (!on && $('#to-pick').querySelectorAll('button[aria-pressed="true"]').length === 1) return;
      tp.setAttribute('aria-pressed', on);
      return;
    }
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, id = b.dataset.id;
    if (a === 'follow') return follow(b.dataset.who);
    if (a === 'unfollow') return unfollow();
    if (a === 'waiting-of') return waitingOf(b.dataset.who);
    if (a === 'join') return startJoin();
    if (a === 'peek') return peek(b);
    if (a === 'zoom') return zoom(b.dataset.mid, +b.dataset.i, b.dataset.name);
    const it = items.find(x => String(x.id) === id);
    if (a === 'answer') return answer(it || +id, b.dataset.t);
    if (a === 'deny') return startDeny(id);
    if (a === 'dismiss') return act('/api/dismiss', {item: +id}, 'Dismissed');
    if (a === 'delete-thread') {
      const n = +b.dataset.n;
      if (!confirm(`Delete this thread (${n} message${n === 1 ? '' : 's'})? It can't be undone.`)) return;
      if (openThread === id) { openThread = null; reading(false); }
      return act('/api/delete', {thread: id}, 'Thread deleted');
    }
    if (a === 'open') { openThread = id; reading(true); return renderThread(id, true); }
    if (a === 'back') { openThread = null; renderList(); return renderDetail(); }
    if (a === 'mback') { openThread = null; reading(false); }
  });
  $('#composer').addEventListener('submit', e => {
    e.preventDefault();
    const form = $('#composer');
    const text = $('#composer-text').value.trim();
    const mode = form.dataset.mode;
    if (mode !== 'deny' && !text) return;
    $('#composer-text').value = '';
    $('#composer-text').blur();
    if (mode === 'answer') return act('/api/answer', {item: +form.dataset.id, text}, 'Answer sent');
    if (mode === 'reply') return act('/api/reply', {reply_to: form.dataset.mid, to: form.dataset.to, text}, 'Reply sent');
    if (mode === 'join') {
      const to = [...$('#to-pick').querySelectorAll('button[aria-pressed="true"]')].map(b => b.dataset.to);
      const mid = form.dataset.mid;
      form.dataset.mode = '';
      return (async () => {
        try {
          for (const who of to) await api('/api/reply', {reply_to: mid, to: who, text});
          status(`Sent to ${to.map(localName).join(' and ')}`);
        } catch (err) { status(err.message, true); }
        await render();
      })();
    }
    if (mode === 'deny') return act('/api/answer', {item: +form.dataset.id, text: 'deny', message: text}, 'Denied');
  });
  $('#composer-text').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#composer').requestSubmit(); }
  });
  $('#composer-deny').addEventListener('click', () => $('#composer').requestSubmit());
  $('#tab-inbox').onclick = () => go('inbox', false);
  $('#all').onclick = () => go('inbox', true);
  $('#tab-mail').onclick = () => go('mail');
  const toggleFilters = open => {
    const f = $('#filters');
    f.hidden = open === undefined ? !f.hidden : !open;
    $('#filter-btn').setAttribute('aria-expanded', !f.hidden);
    renderTabs();
    if (!f.hidden) $('#f-who').focus();
  };
  $('#filter-btn').onclick = () => toggleFilters();
  $('#f-clear').onclick = () => { ['f-who','f-session','f-machine'].forEach(id => $('#'+id).value = ''); $('#f-unread').checked = false; selected = 0; renderList(); renderDetail(); };
  $('#recent-toggle').onclick = () => { recentOpen = $('#recent').classList.contains('shut'); renderRecent(); };
  ['f-unread','f-who','f-session','f-machine'].forEach(id => {
    $('#'+id).addEventListener('input', () => { selected = 0; renderList(); if (!openThread) renderDetail(); });
  });
  document.addEventListener('focusout', () => setTimeout(() => { if (render.pending && !typing()) { render.pending = false; render(); } }));
  let pendingG = false;
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    // A picture open on top: only Escape (and Tab) mean anything.
    if ($('#lightbox')) { if (e.key === 'Escape') { e.preventDefault(); closeZoom(); } return; }
    if (e.key === 'Escape') {
      if (typing()) {
        e.target.blur();
        const mode = $('#composer').dataset.mode;
        if (mode === 'deny' || mode === 'join') { $('#composer').dataset.mode = ''; renderDetail(); }
        return;
      }
      if (!$('#filters').hidden) { toggleFilters(false); return; }
      if (openThread) { openThread = null; renderList(); renderDetail(); return; }
      if (following && view === 'mail') { unfollow(); return; }
      reading(false);
      return;
    }
    if (typing()) return;
    const data = view === 'inbox' ? visibleItems() : mailRows();
    const cur = current();
    const move = d => { if (!data.length) return; openThread = null; selected = Math.max(0, Math.min(data.length - 1, selected + d)); renderList(); renderDetail(); };
    // gg: first row; G: last (as in the TUI). A lone g waits 800 ms for the second.
    const wasG = pendingG; pendingG = false;
    if (e.key === 'g') { if (wasG) { e.preventDefault(); move(-data.length); } else { pendingG = true; setTimeout(() => { pendingG = false; }, 800); } return; }
    if (e.key === 'G') { e.preventDefault(); move(data.length); return; }
    if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    if (e.key === 'i') go('inbox', false);
    if (e.key === 'm') go('mail');
    if (e.key === 'A') go('inbox', !showAll);
    if (e.key === 'o') go('inbox', false);
    if (e.key === 't' && view === 'mail') { const order = ['me', 'agents', 'people']; setScope(order[(order.indexOf(following ? 'people' : mailScope) + 1) % 3]); }
    if (e.key === 'p') { e.preventDefault(); follow(followTarget()); }
    if (e.key === 'u' && view === 'mail') { $('#f-unread').checked = !$('#f-unread').checked; selected = 0; renderList(); renderDetail(); }
    if (e.key === '/') { e.preventDefault(); toggleFilters(true); }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (view === 'inbox' && cur?.thread_id) { openThread = cur.thread_id; renderThread(openThread, true); }
      if (view === 'mail' && mailScope === 'people' && !following) follow(agentsList()[selected]?.addr);
    }
    if (e.key === 'r') {
      e.preventDefault();
      if (!$('#joinbar').hidden) { startJoin(); return; }
      if (!$('#composer').hidden) { $('#composer-text').focus(); return; }
      if (cur?.thread_id) { openThread = cur.thread_id; renderThread(openThread, true).then(() => $('#composer-text').focus()); }
    }
    if (!cur || cur.closed_at) return;
    if (e.key === 'x') act('/api/dismiss', {item: cur.id}, 'Dismissed');
    if (e.key === 'a' && cur.kind === 'approval') answer(cur, 'allow');
    if (e.key === 'd' && cur.kind === 'approval') startDeny(cur.id);
    if (e.key === 'd' && cur.kind !== 'approval' && cur.maybe_in_session_at) act('/api/dismiss', {item: cur.id}, 'Dismissed');
    if (/^[1-8]$/.test(e.key) && cur.options && cur.kind !== 'approval') {
      const opt = cur.options[+e.key - 1];
      if (opt) answer(cur, opt);
    }
  });
  api('/api/me').then(m => { if (m) { me = m.principal; $('#who').textContent = `${m.principal} · ${m.proof}`; } });
  // Desktop notifications (decided 2026-11-23): a new Inbox item while the
  // page is in the background. Off until the person turns it on; kept per
  // browser. The first load only learns what is already open.
  const NOTIFY_KEY = 'mailai.notify';
  const notified = new Set();
  let notifySeeded = false;
  const canNotify = () => 'Notification' in window;
  const notifyOn = () => canNotify() && localStorage.getItem(NOTIFY_KEY) === 'on' && Notification.permission === 'granted';
  const paintBell = () => {
    const b = $('#notify-btn');
    if (!canNotify()) { b.hidden = true; return; }
    b.hidden = false;
    const on = notifyOn(), blocked = Notification.permission === 'denied';
    b.classList.toggle('on', on);
    b.classList.toggle('blocked', blocked);
    b.setAttribute('aria-pressed', String(on));
    b.title = blocked ? 'Notifications are blocked for this page: allow them in the browser\'s site settings'
      : on ? 'Desktop notifications on: click to turn off' : 'Desktop notifications off: click to turn on';
  };
  $('#notify-btn').addEventListener('click', async () => {
    if (notifyOn()) { localStorage.setItem(NOTIFY_KEY, 'off'); paintBell(); status('Notifications off'); return; }
    let p = Notification.permission;
    if (p === 'default') p = await Notification.requestPermission();
    if (p !== 'granted') { paintBell(); status('The browser blocks notifications for this page', true); return; }
    localStorage.setItem(NOTIFY_KEY, 'on'); paintBell();
    // One at once: if it does not appear, the OS blocks the browser.
    new Notification('mailai', {body: 'Notifications are on. If you can read this, new questions will pop up here while this page is in the background.', tag: 'mailai-test'});
    status('Notifications on: a test one was just sent. None appeared? Allow the browser in your system\'s notification settings.');
  });
  // notifyNew gets its own list, not the screen's: the screen holds its
  // refresh while a text box has the cursor, and a notification must not
  // wait for that (found on UbCl).
  const notifyNew = list => {
    const open = list.filter(it => !it.closed_at);
    const fresh = open.filter(it => !notified.has(it.id));
    open.forEach(it => notified.add(it.id));
    if (!notifySeeded) { notifySeeded = true; return; }
    if (!notifyOn() || !(document.hidden || !document.hasFocus())) return;
    for (const it of fresh) {
      const opts = it.options && it.options.length ? ` [${it.options.join(' | ')}]` : '';
      const n = new Notification(`${(KIND[it.kind] || [it.kind])[0]} from ${localName(it.from)}`, {body: question(it) + opts, tag: 'mailai-' + it.id});
      n.onclick = async () => {
        window.focus(); n.close();
        await go('inbox', false);
        const i = visibleItems().findIndex(x => x.id === it.id);
        if (i >= 0) select(i);
      };
    }
  };
  const notifyCheck = async () => {
    try { const r = await api('/api/inbox'); if (r) notifyNew(r.items || []); } catch (e) { /* the screen shows errors */ }
  };
  paintBell();
  notifyCheck();
  setInterval(notifyCheck, 30000);
  const es = new EventSource('/api/events');
  es.addEventListener('attention', notifyCheck);
  const live = on => $('#live').classList.toggle('off', !on);
  ['mail','attention','agent_state','wake','deleted'].forEach(ev => es.addEventListener(ev, () => render()));
  es.onopen = () => live(true);
  es.onerror = () => { live(false); };
  render();
  setInterval(render, 30000);
})();
</script>
</body>
</html>
