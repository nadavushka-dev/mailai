# Claude Code (Anthropic). Hooks live in ~/.claude/settings.json.
name = "claude-code"
description = "Claude Code: hooks in ~/.claude/settings.json"
config = "~/.claude/settings.json"
format = "claude-settings-json"
# Where Claude Code reads Agent Skills; install puts the guide in mailai/.
skills = "~/.claude/skills"

[events.SessionStart]
state = "idle"
notice = true

[events.UserPromptSubmit]
state = "working"
notice = true
signal = "prompt"

[events.PostToolUse]
state = "working"
notice = true
signal = "tool_ran"

[events.Stop]
state = "done"
signal = "turn_ended"

[events.SubagentStop]

[approval]
event = "PermissionRequest"
timeout = 600

[notice]
stdout_events = ["SessionStart", "UserPromptSubmit"]
json_field = "additionalContext"
